<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost Tune - Test UI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --accent-magenta: #A00070;
            --accent-gold: #FFD400;
            --accent-green: #006400;
            --accent-red: #FF0000;
            --text-primary: #FAFAFF;
            --text-muted: #888888;
            --shape-dark: #111111;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* --- INTRO OVERLAY --- */
        #intro-layer {
            position: absolute;
            inset: 0;
            z-index: 100;
            background: var(--bg-color);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease-in-out;
        }

        .zoro-mask {
            position: relative;
            width: 60vw;
            height: 60vh;
            max-width: 600px;
            max-height: 500px;
        }

        .geo-element {
            position: absolute;
            transition: all 1.5s cubic-bezier(0.77, 0, 0.175, 1);
        }

        .g-green-bar { left: 44.72%; width: 4%; height: 120px; bottom: 0; top: auto; background: var(--accent-green); }
        .g-red-circle { left: 51.18%; top: 48.54%; width: 100px; height: 100px; background: var(--accent-red); border-radius: 50%; transform: translate(-50%, -50%); }
        .g-ellipse-border { left: 51.11%; top: 48.44%; width: 110px; height: 110px; border: 1px solid var(--text-primary); border-radius: 50%; box-shadow: 0px 4px 4px rgba(0, 0, 0, 0.25); transform: translate(-50%, -50%); }
        .g-bg-shape { left: 40.28%; top: 38.18%; width: 20%; height: 25%; background: var(--shape-dark); }
        .g-gold-shape { left: 53.26%; top: 49.32%; width: 6px; height: 40px; background: var(--accent-gold); }
        .g-white-shape { right: 41.74%; top: 38.87%; width: 6px; height: 150px; background: var(--text-primary); transform: rotate(10deg); }

        /* --- MAIN UI LAYER --- */
        #app-layer {
            position: absolute; inset: 0; z-index: 10;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 1s ease-in-out;
        }

        .ambient-bg { position: absolute; width: 100vw; height: 100vh; background: radial-gradient(circle, rgba(160,0,112,0.1) 0%, rgba(0,0,0,0) 60%); pointer-events: none; }
        .grid-lines { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px); background-size: 50px 50px; mask-image: radial-gradient(circle at center, black, transparent 70%); pointer-events: none; }

        .logo-area { position: relative; width: 300px; height: 300px; margin-bottom: 30px; }
        .outer-ring { position: absolute; top: 50%; left: 50%; width: 240px; height: 240px; border: 1px solid rgba(250, 250, 255, 0.2); border-radius: 50%; transform: translate(-50%, -50%); animation: rotate 20s linear infinite; }
        .ring-dot { position: absolute; top: -3px; left: 50%; width: 6px; height: 6px; background: var(--text-primary); border-radius: 50%; transform: translateX(-50%); box-shadow: 0 0 10px var(--text-primary); }
        @keyframes rotate { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }

        .music-note { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 120px; height: 120px; }
        .note-head-left { position: absolute; bottom: 10px; left: 0; width: 45px; height: 32px; background: var(--accent-magenta); border-radius: 50%; transform: rotate(-20deg); }
        .note-head-right { position: absolute; bottom: 30px; right: 0; width: 45px; height: 32px; background: var(--text-primary); border-radius: 50%; transform: rotate(20deg); }
        .stem-left { position: absolute; bottom: 30px; left: 38px; width: 5px; height: 80px; background: var(--accent-gold); border-radius: 2px; }
        .beam { position: absolute; top: 0; left: 38px; width: 45px; height: 8px; background: var(--accent-gold); border-radius: 4px; transform: skewX(-5deg); }

        .brand-name { font-size: 56px; font-weight: 900; letter-spacing: -2px; margin-bottom: 10px; background: linear-gradient(to bottom, #fff, #888); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .brand-subtitle { font-size: 12px; text-transform: uppercase; letter-spacing: 6px; color: var(--text-muted); margin-bottom: 50px; }

        .mic-container { position: relative; cursor: pointer; display: flex; flex-direction: column; align-items: center; }
        .mic-btn { width: 60px; height: 60px; background: var(--accent-red); border-radius: 50%; border: 2px solid var(--text-primary); display: flex; align-items: center; justify-content: center; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; z-index: 2; box-shadow: 0 0 20px rgba(255,0,0,0.3); }
        .mic-btn svg { width: 24px; height: 24px; fill: white; }
        .mic-btn:hover { transform: scale(1.1); }

        .pulse-ring { position: absolute; top: 50%; left: 50%; width: 60px; height: 60px; border: 1px solid var(--accent-red); border-radius: 50%; transform: translate(-50%, -50%); opacity: 0; z-index: 1; pointer-events: none; }
        .mic-container.listening .pulse-ring { animation: pulse 2s infinite cubic-bezier(0, 0.2, 0.8, 1); }
        .mic-container.listening .pulse-ring:nth-child(2) { animation-delay: 0.5s; }

        @keyframes pulse { 0% { width: 60px; height: 60px; opacity: 0.8; } 100% { width: 150px; height: 150px; opacity: 0; } }

        .status-text { margin-top: 30px; font-size: 11px; letter-spacing: 2px; color: var(--text-muted); text-transform: uppercase; }
    </style>
</head>
<body>

    <!-- INTRO LAYER -->
    <div id="intro-layer">
        <div class="zoro-mask">
            <div class="geo-element g-bg-shape"></div>
            <div class="geo-element g-green-bar"></div>
            <div class="geo-element g-gold-shape" style="left: 45%; top: 50%;"></div>
            <div class="geo-element g-gold-shape" style="left: 55%; top: 55%;"></div>
            <div class="geo-element g-white-shape" style="left: 42%;"></div>
            <div class="geo-element g-white-shape" style="right: 42%; top: 45%;"></div>
            <div class="geo-element g-ellipse-border"></div>
            <div class="geo-element g-red-circle"></div>
        </div>
    </div>

    <!-- MAIN UI LAYER -->
    <div id="app-layer">
        <div class="ambient-bg"></div>
        <div class="grid-lines"></div>

        <div class="logo-area">
            <div class="outer-ring"><div class="ring-dot"></div></div>
            <div class="music-note">
                <div class="note-head-left"></div>
                <div class="note-head-right"></div>
                <div class="stem-left"></div>
                <div class="beam"></div>
            </div>
        </div>

        <h1 class="brand-name">Lost Tune</h1>
        <p class="brand-subtitle">Voice Agent</p>

        <div class="mic-container" id="micContainer">
            <div class="pulse-ring"></div>
            <div class="pulse-ring"></div>
            <button class="mic-btn" aria-label="Toggle Microphone">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                    <line x1="12" y1="19" x2="12" y2="23"></line>
                    <line x1="8" y1="23" x2="16" y2="23"></line>
                </svg>
            </button>
        </div>
        <div class="status-text" id="statusText">Tap to speak</div>
    </div>

    <script>
        window.addEventListener('load', () => {
            const intro = document.getElementById('intro-layer');
            const app = document.getElementById('app-layer');
            const geoElements = document.querySelectorAll('.geo-element');

            setTimeout(() => {
                geoElements.forEach(el => {
                    el.style.left = '50%';
                    el.style.top = '50%';
                    el.style.transform = 'translate(-50%, -50%) scale(0.8)';
                    el.style.opacity = '0.8';
                });
            }, 500);

            setTimeout(() => {
                intro.style.opacity = '0';
                intro.style.pointerEvents = 'none';
                app.style.opacity = '1';
            }, 2000);
        });

        const micContainer = document.getElementById('micContainer');
        const statusText = document.getElementById('statusText');
        micContainer.addEventListener('click', () => {
            const isActive = micContainer.classList.toggle('listening');
            statusText.textContent = isActive ? "Listening..." : "Tap to speak";
            statusText.style.color = isActive ? "#FFD400" : "#888888";
        });
    </script>
</body>
</html>
